name: "Image: Central latest"

on:
  push:
    branches: ["main"]
    paths:
      - "central/**"
      - "edge/go.mod"
      - "shared/**"
      - "go.work"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/image-central-latest.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-central:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./central/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-central:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-central:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=central
          cache-to: type=gha,mode=max,scope=central
