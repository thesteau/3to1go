name: "CI: End-to-end"

# Builds both images and runs them against real databases, so it only runs on
# the integration and release branches, not on every PR.
on:
  push:
    branches: ["main", "prod"]
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: GitHub keeps only one pending run per group, so queued
# pushes would be skipped. Every push gets its own run, each on its own runner.

jobs:
  e2e:
    # Not a required PR check, because PRs don't run it.
    name: Scout to Station backup and recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Reuses layers cached by earlier runs and by the main-branch image builds.
      - name: Build Station validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: station/Dockerfile
          tags: 3to1go-station-validation
          load: true
          cache-from: |
            type=gha,scope=e2e-station
            type=gha,scope=station
          cache-to: type=gha,mode=max,scope=e2e-station

      - name: Build Scout validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scout/Dockerfile
          tags: 3to1go-scout-validation
          load: true
          cache-from: |
            type=gha,scope=e2e-scout
            type=gha,scope=scout
          cache-to: type=gha,mode=max,scope=e2e-scout

      - name: Run end-to-end test
        env:
          E2E_LOG_DIR: reports/e2e-logs
        run: bash tests/integration/e2e.sh

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-container-logs
          path: reports/e2e-logs/
          if-no-files-found: ignore
          retention-days: 14
