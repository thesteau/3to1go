name: Frontend

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: Type-check, compile and run UI tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and compile TypeScript
        run: npm run build

      - name: Run UI tests
        run: node --test tests/*.cjs
