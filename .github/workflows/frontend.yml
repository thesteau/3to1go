name: Frontend

on:
  push:
    branches: ["main", "prod"]
  pull_request:
    branches-ignore: [release-state]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: Type-check, compile and run UI tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reject committed JavaScript
        shell: bash
        run: |
          files=$(git ls-files -- '*.js' '*.mjs' '*.cjs' '*.jsx' '*.js.map' '*.mjs.map' '*.cjs.map')
          if [ -n "$files" ]; then
            echo "JavaScript must be generated, not committed:"
            printf '%s\n' "$files"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and compile TypeScript
        run: npm run build

      - name: Type-check repository scripts
        run: npx tsc --noEmit --target es2022 --module commonjs --types node --skipLibCheck scripts/release-state.cts scripts/test-report.cts

      # Also writes reports/frontend-tests.html and this job's summary.
      - name: Run UI tests
        run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/test-report.cts --test-reporter-destination=stdout
          "tests/**/*.test.cts"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
