name: Central Tests

on:
  push:
    branches: ["main", "prod"]
  pull_request:
    branches-ignore: [release-state]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run central unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: central

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: central/go.mod
          cache-dependency-path: |
            central/go.sum
            shared/go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install web UI build tools
        working-directory: .
        run: npm ci

      # The server embeds static/js, which go generate compiles from static/ts.
      - name: Generate web UI
        run: go generate ./...

      - name: Download modules
        run: go mod download

      # -json output feeds the HTML report, which also prints failures to this log.
      - name: Run tests
        run: |
          mkdir -p ../reports
          status=0
          go test -race -json -coverprofile=../reports/central-coverage.out ./... ../shared/go/... > ../reports/central-go-tests.json || status=$?
          node ../scripts/test-report.cts go "Central Go tests" ../reports/central-go-tests.json ../reports/central-go-tests.html
          if [ -s ../reports/central-coverage.out ]; then
            go tool cover -html=../reports/central-coverage.out -o ../reports/central-coverage.html
          fi
          exit "$status"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-test-report
          path: |
            reports/*.html
            reports/*.json
          if-no-files-found: ignore
          retention-days: 14
