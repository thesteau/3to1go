name: Docker End-to-End

on:
  push:
    branches: ["main", "prod"]
  pull_request:
    branches-ignore: [release-state]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Edge to Central backup and recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Central validation image
        run: docker build -t 3to1go-central-validation -f central/Dockerfile .

      - name: Build Edge validation image
        run: docker build -t 3to1go-edge-validation -f edge/Dockerfile .

      - name: Run end-to-end test
        env:
          E2E_LOG_DIR: reports/e2e-logs
        run: bash tests/integration/e2e.sh

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-container-logs
          path: reports/e2e-logs/
          if-no-files-found: ignore
          retention-days: 14
