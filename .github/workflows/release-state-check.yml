name: Release metadata

on:
  pull_request_target:
    branches: [release-state]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Require automation branch in this repository
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          [[ "$SAME_REPO" == true && "$HEAD_BRANCH" == release-please--branches--release-state ]]
      - uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate metadata without executing PR code
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_OPERATION: check
          RELEASE_STATE_REF: ${{ github.event.pull_request.head.sha }}
        run: node scripts/release-state.cts
