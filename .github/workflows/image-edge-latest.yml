name: "Image: Edge latest"

# Publishes only main commits that passed the end-to-end test, so an untested
# or failing commit never becomes `latest`.
on:
  workflow_run:
    workflows: ["CI: End-to-end"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

# Only the newest tested commit matters for `latest`, so a newer run may
# replace a pending one.
concurrency:
  group: image-edge-latest
  cancel-in-progress: false

jobs:
  build-edge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      # workflow_run has no path filter, so compare the tested commit with its parent.
      - name: Check for Edge changes
        id: changes
        run: |
          if git diff --quiet HEAD^ HEAD -- edge central/go.mod shared go.work .dockerignore \
              package.json package-lock.json tsconfig.base.json .github/workflows/image-edge-latest.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set short SHA
        if: steps.changes.outputs.changed == 'true'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./edge/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            REVISION=${{ github.event.workflow_run.head_sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-edge:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-edge:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
