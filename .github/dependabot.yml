version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /central
      - /edge
      - /shared/go
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      build-tools:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /central
      - /edge
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      base-images:
        patterns: ["*"]
