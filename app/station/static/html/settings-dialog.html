<dialog id="settings-dialog" class="modal" aria-labelledby="settings-dialog-title">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2 id="settings-dialog-title">Edit Station Settings</h2>
      </div>
      <div class="modal-head-actions">
        <button type="button" onclick="saveSettings()" data-requires="settings" disabled>Save</button>
        <button type="button" class="secondary" onclick="cancelSettings()">Cancel</button>
      </div>
    </div>

    <div class="modal-body">

    <button type="button" class="toggle-btn" id="settings_theme_dark" role="switch" aria-checked="false" onclick="toggleSettingSwitch(this)" data-requires="settings" disabled>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-label">Dark Mode</span>
    </button>

    <button type="button" class="toggle-btn" id="settings_uploads_paused" role="switch" aria-checked="false" onclick="toggleSettingSwitch(this)" data-requires="settings" disabled>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-label">Pause incoming uploads</span>
      <span class="hover-hint" tabindex="0" aria-label="Reject new uploads. Uploads in progress finish." title="Reject new uploads. Uploads in progress finish.">?</span>
    </button>

    <label for="settings_anomaly_mode">Unusual uploads <span class="field-help hover-hint" tabindex="0" aria-label="Station learns each job's usual archive size and flags uploads that are much smaller or larger, with an ntfy alert if notifications are set up." title="Station learns each job's usual archive size and flags uploads that are much smaller or larger, with an ntfy alert if notifications are set up.">?</span></label>
    <select id="settings_anomaly_mode" data-requires="settings" disabled>
      <option value="alert">Flag and alert</option>
      <option value="off">Off</option>
    </select>

    <div class="split-row">
      <div>
        <label for="settings_retention_keep_last">Keep Last Snapshots</label>
        <input id="settings_retention_keep_last" type="number" min="1" data-requires="settings" disabled>
      </div>
      <div>
        <label for="settings_log_level">Log Level</label>
        <select id="settings_log_level" data-requires="settings" disabled>
          <option value="DEBUG">DEBUG</option>
          <option value="INFO">INFO</option>
          <option value="WARNING">WARNING</option>
          <option value="ERROR">ERROR</option>
        </select>
      </div>
    </div>

    <div class="split-row">
      <div>
        <label for="settings_max_upload_size_mb">Max Upload (MB)</label>
        <input id="settings_max_upload_size_mb" type="number" min="1" data-requires="settings" disabled>
      </div>
      <div>
        <label for="settings_upload_chunk_size_mb">Chunk Size (MB)</label>
        <input id="settings_upload_chunk_size_mb" type="number" min="1" data-requires="settings" disabled>
      </div>
    </div>

    <div class="split-row">
      <div>
        <label for="settings_upload_session_ttl_hours">Upload Expiry (hours)</label>
        <input id="settings_upload_session_ttl_hours" type="number" min="1" data-requires="settings" disabled>
      </div>
      <div>
        <label for="settings_upload_cleanup_interval_seconds">Cleanup Interval (s)</label>
        <input id="settings_upload_cleanup_interval_seconds" type="number" min="10" data-requires="settings" disabled>
      </div>
    </div>

    <div>
      <label for="settings_snapshot_verify_interval_hours">Integrity Check (hours)</label>
      <input id="settings_snapshot_verify_interval_hours" type="number" min="0" placeholder="0" data-requires="settings" disabled>
      <p class="hint">Checks each job's latest snapshot. 0 = off. Applies after a restart.</p>
    </div>

    <div class="hook-section">
      <div class="hook-section-head">
        <div>
          <h3>Trusted Certificates <span class="field-help hover-hint" tabindex="0" aria-label="Upload internal CA certificates (.crt, PEM) so Station trusts HTTPS connections to ntfy." title="Upload internal CA certificates (.crt, PEM) so Station trusts HTTPS connections to ntfy.">?</span></h3>
        </div>
        <span class="hint">Up to 10 .crt files. Folder: <code id="certificate-dir">loading...</code></span>
      </div>
      <div class="hook-upload-row">
        <input id="certificate_file_input" type="file" accept=".crt" data-requires="certificates" disabled>
        <button type="button" class="secondary" onclick="uploadCertificateFile()" data-requires="certificates" disabled>Upload</button>
      </div>
      <div id="certificates-load-status" role="status"></div>
      <div id="certificate-files" class="hook-files"></div>
    </div>


    </div><!-- modal-body -->
  </div>
</dialog>
