<dialog id="settings-dialog" class="modal" aria-labelledby="settings-dialog-title">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2 id="settings-dialog-title">Edit Scout Settings</h2>
      </div>
      <div class="modal-head-actions">
        <button type="button" onclick="saveSettings()" data-requires="settings" disabled>Save</button>
        <button type="button" class="secondary" onclick="cancelSettings()">Cancel</button>
      </div>
    </div>

    <div class="modal-body">

    <button type="button" class="toggle-btn" id="settings_theme_dark" role="switch" aria-checked="false" onclick="toggleSettingSwitch(this)" data-requires="settings" disabled>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-label">Dark Mode</span>
    </button>

    <button type="button" class="toggle-btn" id="settings_keep_local_pending" role="switch" aria-checked="false" onclick="toggleSettingSwitch(this)" data-requires="settings" disabled>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-label">Keep failed uploads</span>
      <span class="hover-hint" tabindex="0" aria-label="Retried on the next cycle." title="Retried on the next cycle.">?</span>
    </button>

    <button type="button" class="toggle-btn" id="settings_uploads_paused" role="switch" aria-checked="false" onclick="toggleSettingSwitch(this)" data-requires="settings" disabled>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-label">Pause backups</span>
      <span class="hover-hint" tabindex="0" aria-label="Force Upload still works." title="Force Upload still works.">?</span>
    </button>

    <label for="settings_anomaly_mode">Unusual backups</label>
    <select id="settings_anomaly_mode" data-requires="settings" disabled>
      <option value="hold">Hold and alert</option>
      <option value="alert">Alert only</option>
      <option value="off">Off</option>
    </select>

    <label for="settings_scout_id">Scout ID</label>
    <input id="settings_scout_id" placeholder="scout-01" data-requires="settings" disabled>

    <label for="settings_station_url">Station URL</label>
    <input id="settings_station_url" placeholder="http://127.0.0.1:6555" data-requires="settings" disabled>
    <p class="warning-inline" id="settings-http-warning" style="display:none">
      Plain HTTP sends your Station token unencrypted. Use HTTPS for Scout and Station.
    </p>

    <label for="settings_advertised_url">Advertised URL</label>
    <input id="settings_advertised_url" placeholder="https://scout.example.com" data-requires="settings" disabled>

    <label for="settings_scout_credential">Station Token</label>
    <form method="post" autocomplete="off" data-1p-ignore="true" data-op-ignore="true" data-lpignore="true" data-bwignore="true" data-form-type="other" onsubmit="event.preventDefault();">
      <input id="settings_scout_credential" name="station-token" type="text" class="secret-value" autocomplete="off" spellcheck="false" autocapitalize="none" data-1p-ignore="true" data-op-ignore="true" data-lpignore="true" data-bwignore="true" data-form-type="other" placeholder="Minted on Station" data-requires="settings" disabled>
    </form>

    <label for="settings_cron_schedule">Cron Schedule</label>
    <input id="settings_cron_schedule" placeholder="0 2 * * 0" data-requires="settings" disabled>
    <p class="hint" id="settings-cron-help">Fields are minute, hour, day of month, month, and day of week.</p>

    <div class="split-row">
      <div>
        <label for="settings_max_depth">Max Depth</label>
        <input id="settings_max_depth" type="number" min="0" data-requires="settings" disabled>
      </div>
      <div>
        <label for="settings_log_level">Log Level</label>
        <select id="settings_log_level" data-requires="settings" disabled>
          <option value="DEBUG">DEBUG</option>
          <option value="INFO">INFO</option>
          <option value="WARNING">WARNING</option>
          <option value="ERROR">ERROR</option>
        </select>
      </div>
    </div>

    <details class="settings-advanced">
      <summary>Advanced</summary>

      <label for="settings_state_dir">State Folder</label>
      <input id="settings_state_dir" data-requires="settings" disabled>

      <label for="settings_spool_dir">Spool Folder</label>
      <input id="settings_spool_dir" data-requires="settings" disabled>

      <div class="split-row">
        <div>
          <label for="settings_upload_chunk_size_mb">Chunk Size (MB)</label>
          <input id="settings_upload_chunk_size_mb" type="number" min="1" data-requires="settings" disabled>
        </div>
        <div>
          <label for="settings_min_upload_chunk_size_mb">Min Chunk (MB)</label>
          <input id="settings_min_upload_chunk_size_mb" type="number" min="1" data-requires="settings" disabled>
        </div>
      </div>

      <div class="split-row">
        <div>
          <label for="settings_max_upload_chunk_size_mb">Max Chunk (MB)</label>
          <input id="settings_max_upload_chunk_size_mb" type="number" min="1" data-requires="settings" disabled>
        </div>
        <div>
          <label for="settings_upload_retry_max_attempts">Retry Attempts</label>
          <input id="settings_upload_retry_max_attempts" type="number" min="1" data-requires="settings" disabled>
        </div>
      </div>

      <div class="split-row">
        <div>
          <label for="settings_upload_retry_base_delay_seconds">Retry Delay (s)</label>
          <input id="settings_upload_retry_base_delay_seconds" type="number" min="1" data-requires="settings" disabled>
        </div>
        <div>
          <label for="settings_upload_retry_max_delay_seconds">Max Retry Delay (s)</label>
          <input id="settings_upload_retry_max_delay_seconds" type="number" min="1" data-requires="settings" disabled>
        </div>
      </div>

      <div class="split-row">
        <div>
          <label for="settings_upload_connect_timeout_seconds">Connect Timeout (s)</label>
          <input id="settings_upload_connect_timeout_seconds" type="number" min="1" data-requires="settings" disabled>
        </div>
        <div>
          <label for="settings_upload_read_timeout_padding_seconds">Read Timeout Padding (s)</label>
          <input id="settings_upload_read_timeout_padding_seconds" type="number" min="5" data-requires="settings" disabled>
        </div>
      </div>

      <div class="split-row">
        <div>
          <label for="settings_upload_min_throughput_bytes_per_second">Min Throughput (B/s)</label>
          <input id="settings_upload_min_throughput_bytes_per_second" type="number" min="1024" data-requires="settings" disabled>
        </div>
        <div>
          <label for="settings_circuit_breaker_failure_threshold">Failures Before Pause</label>
          <input id="settings_circuit_breaker_failure_threshold" type="number" min="1" data-requires="settings" disabled>
        </div>
      </div>

      <label for="settings_circuit_breaker_cooldown_seconds">Pause Cooldown (s)</label>
      <input id="settings_circuit_breaker_cooldown_seconds" type="number" min="1" data-requires="settings" disabled>
    </details>

    <div class="hook-section">
      <div class="hook-section-head">
        <div>
          <h3>Trusted Certificates <span class="field-help hover-hint" tabindex="0" aria-label="Upload internal CA certificates (.crt, PEM) so Scout trusts HTTPS connections to Station or ntfy." title="Upload internal CA certificates (.crt, PEM) so Scout trusts HTTPS connections to Station or ntfy.">?</span></h3>
        </div>
        <span class="hint">Up to 10 .crt files. Folder: <code id="certificate-dir">loading...</code></span>
      </div>
      <div class="hook-upload-row">
        <input id="certificate_file_input" type="file" accept=".crt" data-requires="certificates" disabled>
        <button type="button" class="secondary" onclick="uploadCertificateFile()" data-requires="certificates" disabled>Upload</button>
      </div>
      <div id="certificates-load-status" role="status"></div>
      <div id="certificate-files" class="hook-files"></div>
    </div>


    </div><!-- modal-body -->
  </div>
</dialog>
