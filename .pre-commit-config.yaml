# Optional local hooks that mirror the CI lint checks: `pre-commit install` once per clone.
# The local hooks need npm --prefix app ci, Go and golangci-lint; hadolint needs Docker.
repos:
  - repo: local
    hooks:
      - id: biome
        name: biome (format and lint TypeScript)
        entry: app/node_modules/.bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [ts, json]
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: golangci-lint
        name: golangci-lint
        entry: sh -c 'for m in app/shared/go app/station app/scout; do (cd "$m" && golangci-lint run ./...) || exit 1; done'
        language: system
        types: [go]
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Scans staged changes; test-only fake keys are allowlisted in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        args: [--config, app/.hadolint.yaml]
