services:
  scout:
    container_name: 3to1go-scout
    image: ghcr.io/thesteau/3to1go-scout:latest
    env_file:
      - ./.env
    ports:
      - "6556:6556"
    volumes:
      - ./config:/config
      - ./hook-scripts:/hook-scripts
      # Folder to back up; set SCAN_DIR in .env.
      # For several folders or drives, see:
      # https://3to1go.docs.thesteau.com/scout/multiple-folders
      - ${SCAN_DIR:-./scan}:/scan
      - ./state:/data/state
      - ./spool:/data/spool
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
