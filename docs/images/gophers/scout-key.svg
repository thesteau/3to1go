<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title description">
  <title id="title">A Scout gopher holds the Scout key</title>
  <desc id="description">A Scout gopher in an explorer hat holds a gold key next to a sealed, locked box. Scout encrypts its snapshots with this key; Station stores them without receiving the key.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a52b3d"/>
    </marker>
    <g id="gopher">
      <g fill="#8ed1f0" stroke="#2b3240" stroke-width="3">
        <circle cx="20" cy="22" r="10"/>
        <circle cx="80" cy="22" r="10"/>
        <path d="M50 8 C82 8 92 32 92 62 V96 C92 114 76 122 50 122 C24 122 8 114 8 96 V62 C8 32 18 8 50 8 Z"/>
      </g>
      <g fill="#f2d3b3" stroke="#2b3240" stroke-width="2.5">
        <ellipse cx="32" cy="122" rx="12" ry="5"/>
        <ellipse cx="68" cy="122" rx="12" ry="5"/>
      </g>
      <g fill="#fff" stroke="#2b3240" stroke-width="2.5">
        <circle cx="33" cy="40" r="14"/>
        <circle cx="67" cy="40" r="14"/>
      </g>
      <g fill="#2b3240">
        <circle cx="37" cy="42" r="5.5"/>
        <circle cx="71" cy="42" r="5.5"/>
      </g>
      <g fill="#fff">
        <circle cx="39" cy="40" r="1.8"/>
        <circle cx="73" cy="40" r="1.8"/>
      </g>
      <rect x="45.5" y="66" width="9" height="9" rx="1.5" fill="#fff" stroke="#2b3240" stroke-width="2"/>
      <ellipse cx="50" cy="61" rx="13" ry="8.5" fill="#f2d3b3" stroke="#2b3240" stroke-width="2.5"/>
      <ellipse cx="50" cy="55.5" rx="6" ry="4" fill="#2b3240"/>
      <path d="M50 69.5 V75" stroke="#2b3240" stroke-width="1.5"/>
    </g>
    <g id="scout-hat">
      <path d="M26 16 C28 -4 72 -4 74 16 Z" fill="#c9a36b" stroke="#2b3240" stroke-width="2.5"/>
      <path d="M29 11 H71" stroke="#7a5a2e" stroke-width="3"/>
      <ellipse cx="50" cy="16" rx="38" ry="5.5" fill="#b88d52" stroke="#2b3240" stroke-width="2.5"/>
    </g>
    <g id="hard-hat">
      <path d="M24 18 C24 -6 76 -6 76 18 Z" fill="#f4c542" stroke="#2b3240" stroke-width="2.5"/>
      <path d="M50 2 V16" stroke="#d9a520" stroke-width="3"/>
      <rect x="16" y="15" width="68" height="7" rx="3.5" fill="#f4c542" stroke="#2b3240" stroke-width="2.5"/>
    </g>
    <g id="box">
      <rect width="40" height="32" rx="3" fill="#d9a86c" stroke="#2b3240" stroke-width="2.5"/>
      <rect x="17" y="1.5" width="6" height="29" fill="#f3dcb5"/>
      <path d="M17.5 13 V10 A2.5 2.5 0 0 1 22.5 10 V13" fill="none" stroke="#2b3240" stroke-width="1.8"/>
      <rect x="15" y="13" width="10" height="8" rx="1.5" fill="#c73346" stroke="#2b3240" stroke-width="1.5"/>
    </g>
    <g id="arms">
      <g fill="#f2d3b3" stroke="#2b3240" stroke-width="2.5">
        <ellipse cx="9" cy="76" rx="6" ry="9"/>
        <ellipse cx="91" cy="76" rx="6" ry="9"/>
      </g>
    </g>
    <g id="hands">
      <g fill="#f2d3b3" stroke="#2b3240" stroke-width="2.5">
        <ellipse cx="28" cy="92" rx="6" ry="8"/>
        <ellipse cx="72" cy="92" rx="6" ry="8"/>
      </g>
    </g>
  </defs>

  <rect width="560" height="300" rx="18" fill="#faf8f5"/>
  <path d="M20 250 H540" stroke="#e3ddd3" stroke-width="3"/>

  <g transform="translate(60 85) scale(1.3)">
    <use href="#gopher"/>
    <use href="#arms"/>
    <use href="#scout-hat"/>
  </g>

  <!-- Gold key held in the right hand -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#2b3240" stroke-width="11">
      <circle cx="198" cy="184" r="15"/>
      <path d="M213 184 H300 M282 184 V200 M296 184 V196"/>
    </g>
    <g stroke="#f4c542" stroke-width="6">
      <circle cx="198" cy="184" r="15"/>
      <path d="M213 184 H300 M282 184 V200 M296 184 V196"/>
    </g>
  </g>
  <ellipse cx="180" cy="184" rx="8" ry="11" fill="#f2d3b3" stroke="#2b3240" stroke-width="2.5"/>
  <g fill="#f4c542" stroke="#d9a520" stroke-width="1.5" stroke-linejoin="round">
    <path d="M238 148 L241 157 L250 160 L241 163 L238 172 L235 163 L226 160 L235 157 Z"/>
    <path d="M300 152 L302 158 L308 160 L302 162 L300 168 L298 162 L292 160 L298 158 Z"/>
  </g>

  <path d="M316 190 Q340 200 360 206" fill="none" stroke="#a52b3d" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <use href="#box" transform="translate(370 180) scale(2.2)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="125" y="276" font-size="15" font-weight="700" fill="#242a35">Scout key</text>
    <text x="125" y="294" font-size="13" fill="#586273">Only this Scout has it</text>
    <text x="414" y="276" font-size="15" font-weight="700" fill="#242a35">Encrypted snapshot</text>
    <text x="414" y="294" font-size="13" fill="#586273">Station keeps it sealed</text>
  </g>
</svg>
