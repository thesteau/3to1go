<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="title description">
  <title id="title">Station floats a copy of its snapshots to the cloud</title>
  <desc id="description">A gopher on the Station roof sends sealed boxes up on red balloons. In the cloud, another gopher keeps the boxes stacked as an offsite copy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a52b3d"/>
    </marker>
    <g id="gopher">
      <g fill="#8ed1f0" stroke="#2b3240" stroke-width="3">
        <circle cx="20" cy="22" r="10"/>
        <circle cx="80" cy="22" r="10"/>
        <path d="M50 8 C82 8 92 32 92 62 V96 C92 114 76 122 50 122 C24 122 8 114 8 96 V62 C8 32 18 8 50 8 Z"/>
      </g>
      <g fill="#f2d3b3" stroke="#2b3240" stroke-width="2.5">
        <ellipse cx="32" cy="122" rx="12" ry="5"/>
        <ellipse cx="68" cy="122" rx="12" ry="5"/>
      </g>
      <g fill="#fff" stroke="#2b3240" stroke-width="2.5">
        <circle cx="33" cy="40" r="14"/>
        <circle cx="67" cy="40" r="14"/>
      </g>
      <g fill="#2b3240">
        <circle cx="37" cy="42" r="5.5"/>
        <circle cx="71" cy="42" r="5.5"/>
      </g>
      <g fill="#fff">
        <circle cx="39" cy="40" r="1.8"/>
        <circle cx="73" cy="40" r="1.8"/>
      </g>
      <rect x="45.5" y="66" width="9" height="9" rx="1.5" fill="#fff" stroke="#2b3240" stroke-width="2"/>
      <ellipse cx="50" cy="61" rx="13" ry="8.5" fill="#f2d3b3" stroke="#2b3240" stroke-width="2.5"/>
      <ellipse cx="50" cy="55.5" rx="6" ry="4" fill="#2b3240"/>
      <path d="M50 69.5 V75" stroke="#2b3240" stroke-width="1.5"/>
    </g>
    <g id="scout-hat">
      <path d="M26 16 C28 -4 72 -4 74 16 Z" fill="#c9a36b" stroke="#2b3240" stroke-width="2.5"/>
      <path d="M29 11 H71" stroke="#7a5a2e" stroke-width="3"/>
      <ellipse cx="50" cy="16" rx="38" ry="5.5" fill="#b88d52" stroke="#2b3240" stroke-width="2.5"/>
    </g>
    <g id="hard-hat">
      <path d="M24 18 C24 -6 76 -6 76 18 Z" fill="#f4c542" stroke="#2b3240" stroke-width="2.5"/>
      <path d="M50 2 V16" stroke="#d9a520" stroke-width="3"/>
      <rect x="16" y="15" width="68" height="7" rx="3.5" fill="#f4c542" stroke="#2b3240" stroke-width="2.5"/>
    </g>
    <g id="box">
      <rect width="40" height="32" rx="3" fill="#d9a86c" stroke="#2b3240" stroke-width="2.5"/>
      <rect x="17" y="1.5" width="6" height="29" fill="#f3dcb5"/>
      <path d="M17.5 13 V10 A2.5 2.5 0 0 1 22.5 10 V13" fill="none" stroke="#2b3240" stroke-width="1.8"/>
      <rect x="15" y="13" width="10" height="8" rx="1.5" fill="#c73346" stroke="#2b3240" stroke-width="1.5"/>
    </g>
    <g id="arms">
      <g fill="#f2d3b3" stroke="#2b3240" stroke-width="2.5">
        <ellipse cx="9" cy="76" rx="6" ry="9"/>
        <ellipse cx="91" cy="76" rx="6" ry="9"/>
      </g>
    </g>
    <g id="hands">
      <g fill="#f2d3b3" stroke="#2b3240" stroke-width="2.5">
        <ellipse cx="28" cy="92" rx="6" ry="8"/>
        <ellipse cx="72" cy="92" rx="6" ry="8"/>
      </g>
    </g>
  </defs>

  <rect width="680" height="330" rx="18" fill="#faf8f5"/>
  <path d="M20 270 H660" stroke="#e3ddd3" stroke-width="3"/>

  <!-- Station building -->
  <rect x="30" y="170" width="220" height="100" fill="#fff0f2" stroke="#a52b3d" stroke-width="2.5"/>
  <rect x="24" y="162" width="232" height="10" fill="#f3d7dc" stroke="#a52b3d" stroke-width="2.5"/>
  <rect x="70" y="190" width="140" height="28" rx="6" fill="#a52b3d"/>
  <text x="140" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#fff" text-anchor="middle">STATION</text>
  <rect x="120" y="232" width="40" height="38" fill="#f7e3e6" stroke="#a52b3d" stroke-width="2"/>

  <g transform="translate(150 60) scale(0.8)">
    <use href="#gopher"/>
    <use href="#arms"/>
    <use href="#hard-hat"/>
  </g>

  <!-- First balloon, just released -->
  <path d="M228 124 Q250 160 278 166" fill="none" stroke="#a52b3d" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M286 140 L281 152 M294 140 L299 152" stroke="#2b3240" stroke-width="1.5"/>
  <use href="#box" transform="translate(277 152) scale(0.65)"/>
  <ellipse cx="290" cy="110" rx="24" ry="30" fill="#e05263" stroke="#2b3240" stroke-width="2.5"/>
  <ellipse cx="281" cy="99" rx="5" ry="9" fill="#fff" opacity="0.5"/>
  <path d="M286 140 L290 146 L294 140 Z" fill="#e05263" stroke="#2b3240" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Second balloon, higher up -->
  <path d="M312 86 Q352 52 390 64" fill="none" stroke="#a52b3d" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M407 90 L404 98 M413 90 L416 98" stroke="#2b3240" stroke-width="1.5"/>
  <use href="#box" transform="translate(401 98) scale(0.45)"/>
  <ellipse cx="410" cy="70" rx="16" ry="20" fill="#e05263" stroke="#2b3240" stroke-width="2"/>
  <ellipse cx="404" cy="63" rx="3.5" ry="6" fill="#fff" opacity="0.5"/>
  <path d="M428 72 Q440 76 450 86" fill="none" stroke="#a52b3d" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <!-- Cloud storage -->
  <path d="M480 160 C445 160 445 112 476 104 C472 62 520 42 548 68 C566 34 628 42 630 86 C664 86 668 160 634 160 Z" fill="#edf3fb" stroke="#7890af" stroke-width="2"/>
  <use href="#box" transform="translate(490 128) scale(0.65)"/>
  <use href="#box" transform="translate(518 128) scale(0.65)"/>
  <use href="#box" transform="translate(504 107) scale(0.65)"/>
  <g transform="translate(566 90) scale(0.5)">
    <use href="#gopher"/>
    <use href="#arms"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="140" y="296" font-size="15" font-weight="700" fill="#242a35">Station</text>
    <text x="140" y="314" font-size="13" fill="#586273">Backup folder on disk</text>
    <text x="350" y="296" font-size="15" font-weight="700" fill="#242a35">Sync tool</text>
    <text x="350" y="314" font-size="13" fill="#586273">Copies the encrypted files</text>
    <text x="556" y="296" font-size="15" font-weight="700" fill="#242a35">Cloud storage</text>
    <text x="556" y="314" font-size="13" fill="#586273">Copy 3, offsite</text>
  </g>
</svg>