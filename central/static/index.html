<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3to1go Central</title>
  <link rel="icon" type="image/png" href="/static/img/favicon-app.png">
  <!-- app-styles -->
</head>
<body>
  <main class="page-shell">
    <div id="connection-status" role="status"></div>
    <section class="hero panel">
      <div class="hero-top">
        <div class="hero-text">
          <h1>3to1go Central</h1>
          <p class="eyebrow">Snapshot receiver</p>
          <p class="lede">
            Browse snapshots by edge and job, download archives, or delete individual snapshots.
          </p>
        </div>
        <img src="/static/img/3to1go.png" alt="Go gophers racing" class="hero-gopher">
      </div>
      <div class="meta-grid" id="meta"><div class="section-loading" role="status"><span class="section-spinner" aria-hidden="true"></span><span>Loading…</span></div></div>
      <div class="meta-grid" id="storage-meta"><div class="section-loading" role="status"><span class="section-spinner" aria-hidden="true"></span><span>Loading…</span></div></div>
      <div class="toolbar">
        <button type="button" onclick="manualRefresh()">Refresh</button>
<button type="button" class="secondary" onclick="openCredentialDialog()">Mint Edge Credential</button>
        <button type="button" class="secondary" onclick="openNtfyDialog()">Configure ntfy</button>
        <button type="button" class="secondary" onclick="openHooksDialog()">Custom Scripts</button>
        <span class="toolbar-spacer"></span>
        <button type="button" class="secondary" onclick="openUserManagementDialog()">Admin</button>
        <button type="button" data-requires="settings" disabled onclick="openSettingsDialog()">Edit Central Settings</button>
      </div>
      <div id="verify-status"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>Stored Snapshots</h2>
        <p class="hint">Central remains file-based. This view reads directly from the current backup root on disk.</p>
      </div>
      <div id="namespaces" class="namespaces-list"><div class="section-loading" role="status"><span class="section-spinner" aria-hidden="true"></span><span>Loading…</span></div></div>
    </section>
  </main>

  <div id="toast-region" class="toast-region" popover="manual" aria-live="polite" aria-atomic="false"></div>

  <!-- app-dialogs -->

  <script defer src="/static/js/utils.js"></script>
  <script defer src="/static/js/crypto.js"></script>
  <script defer src="/static/js/ui.js"></script>
  <script defer src="/static/js/auth.js"></script>
  <script defer src="/static/js/users.js"></script>
  <script defer src="/static/js/admin.js"></script>
  <script defer src="/static/js/notifications.js"></script>
  <script defer src="/static/js/certificates.js"></script>
  <script defer src="/static/js/hooks.js"></script>
  <script defer src="/static/js/credentials.js"></script>
  <script defer src="/static/js/keys.js"></script>
  <script defer src="/static/js/snapshots.js"></script>
  <script defer src="/static/js/instances.js"></script>
  <script defer src="/static/js/verification.js"></script>
  <script defer src="/static/js/overview.js"></script>
  <script defer src="/static/js/app.js"></script>
</body>
</html>
